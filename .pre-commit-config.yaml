default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests + coverage gate (same as ci.yml)
        entry: bash -c 'python -m pytest tests/unit -q --cov=shared && python -m coverage report --include=shared/eval/metrics.py,shared/retrieval.py --fail-under=80'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
