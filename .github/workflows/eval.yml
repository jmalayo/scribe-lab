name: eval

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      mode:
        description: "check compara con la línea base; baseline genera una nueva"
        type: choice
        options: [check, baseline]
        default: check

permissions:
  contents: read

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EMBEDDING_MODEL: paraphrase-multilingual-MiniLM-L12-v2
  EMBEDDING_REVISION: e8f8c211226b894fcb81acc59f3b34ba3efd5f42

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - run: pip install -r app/requirements.txt rapidfuzz==3.14.6 pandas==2.3.3

      - uses: actions/cache@v4
        with:
          path: ~/tei-data
          key: tei-${{ env.EMBEDDING_REVISION }}

      - name: Start the embedder (TEI on CPU)
        run: |
          docker run -d --name tei -p 1010:80 -v ~/tei-data:/data \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.8 \
            --model-id sentence-transformers/${EMBEDDING_MODEL} --revision ${EMBEDDING_REVISION}
          timeout 600 bash -c 'until curl -sf http://127.0.0.1:1010/health; do sleep 5; done'
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:6333/readyz; do sleep 2; done'

      - name: Index corpus_demo
        run: python -m app.reindex

      - name: Gate
        env:
          GATE_MODE: ${{ inputs.mode || 'check' }}
        run: python -m shared.eval.gate

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-hits
          path: gate_hits.csv
