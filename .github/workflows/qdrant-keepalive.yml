name: qdrant-keepalive

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the Qdrant Cloud cluster
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            --header "api-key: $QDRANT_API_KEY" \
            "$QDRANT_URL/collections" > /dev/null
