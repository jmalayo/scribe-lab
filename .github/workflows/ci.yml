name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - run: ruff check .

      - run: lint-imports

      - run: pytest tests/unit -v --cov=shared --cov-report=term-missing

      - run: coverage report --include=shared/eval/metrics.py,shared/retrieval.py --fail-under=80

  integration:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scribe
          POSTGRES_PASSWORD: scribe
          POSTGRES_DB: scribe
        ports:
          - 1015:5432
        options: >-
          --health-cmd "pg_isready -U scribe -d scribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - run: timeout 60 bash -c 'until curl -sf http://127.0.0.1:6333/readyz; do sleep 2; done'

      - run: pytest tests/integration -v
