name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - run: ruff check .

      - run: pytest tests/unit -v --cov=shared --cov-report=term-missing

      - run: coverage report --include=shared/eval/metrics.py,shared/retrieval.py --fail-under=80
